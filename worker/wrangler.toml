name = "fisher-firearms-api"
main = "index.js"
compatibility_date = "2025-01-01"

# Public site origins allowed to call this API.
[vars]
SITE_URL = "https://kampm-05.github.io/fisher-firearms"
ALLOWED_ORIGINS = "https://kampm-05.github.io,http://localhost:5180,http://localhost:5199"

# Stock, orders and admin sessions.
# `wrangler dev` ignores this id and uses local storage; replace it with the
# real one from `wrangler kv namespace create SHOP_KV` before deploying.
[[kv_namespaces]]
binding = "SHOP_KV"
id = "local_placeholder_replace_before_deploy"

# Secrets — set with `wrangler secret put <NAME>`, never committed:
#   STRIPE_SECRET_KEY      sk_test_... (or sk_live_... when going live)
#   STRIPE_WEBHOOK_SECRET  whsec_...   (from the webhook endpoint)
#   ADMIN_PASSWORD         the shop's admin password
