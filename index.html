<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fisher Firearms — the largest gun shop in Adelaide. New and used firearms, ammunition, optics, reloading and hunting gear. 20 Magill Road, Norwood SA."
    />
    <meta name="theme-color" content="#0d1013" />

    <!-- How the site looks when someone shares it in Messenger or WhatsApp. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fisher Firearms" />
    <meta property="og:title" content="Fisher Firearms — Adelaide's Largest Gun Shop" />
    <meta
      property="og:description"
      content="New and used firearms, ammunition, optics, reloading and hunting gear. 20 Magill Road, Norwood SA."
    />
    <meta property="og:locale" content="en_AU" />
    <meta name="twitter:card" content="summary" />

    <!-- Keeps a Stripe session id out of any third party's referrer log. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Fisher Firearms — Adelaide's Largest Gun Shop | Norwood SA</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
