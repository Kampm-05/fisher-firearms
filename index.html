<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fisher Firearms — the largest gun shop in Adelaide. New and used firearms, ammunition, optics, reloading and hunting gear. 20 Magill Road, Norwood SA."
    />
    <meta name="theme-color" content="#0d1013" />

    <!-- How the site looks when someone shares it in Messenger or WhatsApp. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fisher Firearms" />
    <meta property="og:title" content="Fisher Firearms — Adelaide's Largest Gun Shop" />
    <meta
      property="og:description"
      content="New and used firearms, ammunition, optics, reloading and hunting gear. 20 Magill Road, Norwood SA."
    />
    <meta property="og:locale" content="en_AU" />
    <meta name="twitter:card" content="summary" />

    <!-- Keeps a Stripe session id out of any third party's referrer log. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      What this page is allowed to load. GitHub Pages serves a fixed set of
      response headers and gives no way to add one, so the policy travels in
      the document instead. A meta policy covers everything here except
      frame-ancestors, which browsers only honour from a real header — see
      HANDOFF.md for the fix that comes with the custom domain.

      Fonts, styles and scripts are all first-party now. The only outside
      origin the page talks to is the shop's own API.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               img-src 'self' data: blob:;
               font-src 'self';
               style-src 'self' 'unsafe-inline';
               script-src 'self';
               connect-src 'self' https://fisher-firearms-api.fisher-firearms.workers.dev;
               form-action 'self' https://checkout.stripe.com;
               frame-ancestors 'none';
               upgrade-insecure-requests"
    />
    <title>Fisher Firearms — Adelaide's Largest Gun Shop | Norwood SA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
