name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gates, in the order that fails fastest. Each one blocks the deploy, so
      # a broken build or a licensed item marked postable can never reach the
      # live shop.
      - name: Lint
        run: npm run lint

      - name: Check the shop's rules still hold
        # Needs no secrets and no network: sale-type law, pricing, validation
        # and webhook signature checks.
        run: node worker/test-unit.mjs

      - name: Report known vulnerabilities
        # Advisory only — a new advisory in a dev dependency should not stop
        # the shop deploying a price change.
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Build
        env:
          # Project sites are served from /<repo>/, so the bundle needs that base.
          VITE_BASE: /${{ github.event.repository.name }}/
          # The shop's API (Cloudflare Worker): live stock, payments, admin.
          # Unset simply means the site falls back to its built-in catalogue.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Add SPA fallback
        # Pages serves static files only — an unknown path like /firearms/used
        # would 404. Serving index.html as the 404 page hands those routes to
        # React Router instead.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
